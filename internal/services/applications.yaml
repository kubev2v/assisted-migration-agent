# Confidence scores: High=75, Medium=50, Low=25.
# Scores are configured values and do not change based on the signals matched for a VM.
# Definitions without an explicit score default to 75 when only processes are configured, otherwise 50.
# When both processes and products are configured, matching defaults to requiring both.
# Set match to any or all to override the default for an individual application.
# Certification status: yes requires explicit certification, partner validation, or a released catalog listing.
# no indicates a documented compatibility blocker or an unsupported VMware appliance.
# maybe means migration is plausible or certification evidence is missing or conflicting.
# Each certification_comment explains the evidence; an OpenShift integration does not make a VMware OVA portable.

