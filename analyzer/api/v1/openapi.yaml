      properties:
        name:
          type: string
          description: Application name
        description:
          type: string
          description: Application description
        vmCount:
          type: integer
          description: Number of VMs running this application
        vms:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationVM'

    ApplicationVM:
      type: object
      required:
