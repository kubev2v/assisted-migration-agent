name: PR Validations

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main, stable]

permissions:
  pull-requests: read
  contents: read

jobs:
  # Configuration job - define all shared values once
  config:
    runs-on: ubuntu-latest
    outputs:
      allowed-types: ${{ steps.set-config.outputs.allowed-types }}
      jira-pattern: ${{ steps.set-config.outputs.jira-pattern }}
      jira-required-types: ${{ steps.set-config.outputs.jira-required-types }}
      bot-authors: ${{ steps.set-config.outputs.bot-authors }}
      run-code-validations: ${{ steps.filter.outputs.code }}
    steps:
      - id: set-config
        run: |
          echo 'allowed-types=["feat","fix","ci","build","chore","docs","refactor","test","style","perf","revert"]' >> $GITHUB_OUTPUT
          echo 'jira-pattern=(ECOPROJECT|OMA)-[0-9]+' >> $GITHUB_OUTPUT
          echo 'jira-required-types=["feat","fix"]' >> $GITHUB_OUTPUT
          echo 'bot-authors=["red-hat-konflux[bot]","dependabot[bot]"]' >> $GITHUB_OUTPUT

      - name: Check out path filters
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Detect whether code validations are needed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: .github/path-filters.yml
          predicate-quantifier: 'every'

  # Validate commit messages
  validate-commits:
    needs: config
    uses: kubev2v/migration-planner-workflows/.github/workflows/validate-commit-messages.yml@main
    with:
      types: ${{ needs.config.outputs.allowed-types }}
      jira-pattern: ${{ needs.config.outputs.jira-pattern }}
      jira-required-types: ${{ needs.config.outputs.jira-required-types }}
      skip-authors: ${{ needs.config.outputs.bot-authors }}

  # Validate PR title and description
  validate-pr-title:
    needs: config
    uses: kubev2v/migration-planner-workflows/.github/workflows/validate-pr-title-description.yml@main
    with:
      allowed-types: ${{ needs.config.outputs.allowed-types }}
      jira-pattern: ${{ needs.config.outputs.jira-pattern }}
      jira-required-types: ${{ needs.config.outputs.jira-required-types }}
      skip-authors: ${{ needs.config.outputs.bot-authors }}

  lint:
    name: Lint
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Run golangci-lint
        run: make lint

  format-check:
    name: Format Check
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Check code formatting
        run: make check-format

  tidy-check:
    name: Go Mod Tidy Check
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Check go.mod and go.sum are tidy
        run: make tidy-check

  check-generate:
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Check generated files are up to date
        run: |
          make check-generate
          # The Makefile only checks for uncommitted changes, allowing users to keep untracked files in the repository.
          # Here, we also check for untracked files, as none are expected at this stage.
          if [[ $(git ls-files --others --exclude-standard) ]]; then git ls-files --others --exclude-standard; echo "These files are not tracked by git"; exit 1; fi

  verify-build:
    name: Verify Build
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Verify code compiles
        run: make build

  unit-test:
    needs: [config, validate-commits, validate-pr-title]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.2'

    - name: Run the tests
      run: make test

  # Always runs so branch protection can require this single check.
  # Skipped jobs count as success, but a failed commit check would also skip
  # them — this job fails unless commit/title checks passed and, when code
  # changed, the code validations passed.
  required:
    name: Required validations
    needs:
      - config
      - validate-commits
      - validate-pr-title
      - lint
      - format-check
      - tidy-check
      - check-generate
      - verify-build
      - unit-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          RUN_CODE: ${{ needs.config.outputs.run-code-validations }}
          CONFIG: ${{ needs.config.result }}
          COMMITS: ${{ needs.validate-commits.result }}
          TITLE: ${{ needs.validate-pr-title.result }}
          LINT: ${{ needs.lint.result }}
          FORMAT: ${{ needs.format-check.result }}
          TIDY: ${{ needs.tidy-check.result }}
          GENERATE: ${{ needs.check-generate.result }}
          BUILD: ${{ needs.verify-build.result }}
          TEST: ${{ needs.unit-test.result }}
        run: |
          echo "config=$CONFIG commits=$COMMITS title=$TITLE run_code=$RUN_CODE"
          echo "lint=$LINT format=$FORMAT tidy=$TIDY generate=$GENERATE build=$BUILD test=$TEST"

          fail() { echo "::error::$1"; exit 1; }

          [[ "$CONFIG" == success ]] || fail "config did not succeed ($CONFIG)"
          [[ "$COMMITS" == success ]] || fail "validate-commits did not succeed ($COMMITS)"
          [[ "$TITLE" == success ]] || fail "validate-pr-title did not succeed ($TITLE)"

          if [[ "$RUN_CODE" == true ]]; then
            [[ "$LINT" == success ]] || fail "lint did not succeed ($LINT)"
            [[ "$FORMAT" == success ]] || fail "format-check did not succeed ($FORMAT)"
            [[ "$TIDY" == success ]] || fail "tidy-check did not succeed ($TIDY)"
            [[ "$GENERATE" == success ]] || fail "check-generate did not succeed ($GENERATE)"
            [[ "$BUILD" == success ]] || fail "verify-build did not succeed ($BUILD)"
            [[ "$TEST" == success ]] || fail "unit-test did not succeed ($TEST)"
          else
            echo "Only skippable files changed; code validations were skipped"
          fi
