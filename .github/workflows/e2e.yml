name: Run e2e tests

on:
  workflow_dispatch:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      run-code-validations: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check out path filters
        uses: actions/checkout@v4

      - name: Detect whether code validations are needed
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: .github/path-filters.yml
          predicate-quantifier: 'every'

  e2e:
    needs: [config]
    if: needs.config.outputs.run-code-validations == 'true'
    runs-on: ubuntu-latest
    name: e2e
    env:
      AGENT_IMAGE: assisted-migration-agent:e2e
      BACKEND_IMAGE: migration-planner-api
      BACKEND_TAG: e2e

    steps:
      - name: Checkout agent code
        uses: actions/checkout@v4

      - name: Checkout migration-planner
        uses: actions/checkout@v4
        with:
          repository: kubev2v/migration-planner
          path: migration-planner

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Start Podman socket
        run: |
          systemctl --user enable --now podman.socket
          echo "PODMAN_SOCKET=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> $GITHUB_ENV

      - name: Build backend API container
        run: |
          cd migration-planner
          make migration-planner-api-container MIGRATION_PLANNER_IMAGE=${{ env.BACKEND_IMAGE }} MIGRATION_PLANNER_IMAGE_TAG=${{ env.BACKEND_TAG }}

      - name: Build agent container
        run: |
          make image IMAGE_NAME=assisted-migration-agent IMAGE_TAG=e2e

      - name: Build e2e binary
        run: |
          make build.e2e

      - name: Pull test images
        run: |
          podman pull docker.io/library/postgres:17
          podman pull docker.io/vmware/vcsim:latest

      - name: Download RHCOS ISO
        run: |
          mkdir -p iso
          curl --silent -C - -o iso/rhcos-live-iso.x86_64.iso \
            https://mirror.openshift.com/pub/openshift-v4/dependencies/rhcos/latest/rhcos-live-iso.x86_64.iso

      - name: Run e2e tests
        run: |
          ./bin/e2e \
            -backend-image=${{ env.BACKEND_IMAGE }}:${{ env.BACKEND_TAG }} \
            -agent-image=${{ env.AGENT_IMAGE }} \
            -podman-socket=${{ env.PODMAN_SOCKET }} \
            -iso-path=${{ github.workspace }}/iso \
            --ginkgo.v

  # Always runs so branch protection can require this single check.
  required:
    name: Required e2e validations
    needs:
      - config
      - e2e
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          RUN_CODE: ${{ needs.config.outputs.run-code-validations }}
          CONFIG: ${{ needs.config.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "config=$CONFIG e2e=$E2E run_code=$RUN_CODE"

          fail() { echo "::error::$1"; exit 1; }

          [[ "$CONFIG" == success ]] || fail "config did not succeed ($CONFIG)"

          if [[ "$RUN_CODE" == true ]]; then
            [[ "$E2E" == success ]] || fail "e2e did not succeed ($E2E)"
          else
            echo "Only skippable files changed; e2e tests were skipped"
          fi
